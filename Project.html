<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
        /* Global styles */
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* Navbar */
        nav.navbar {
            position: sticky;
            top: 0;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        nav .logo {
            font-weight: 700;
            font-size: 1.5rem;
        }
        nav ul.nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 1.5rem;
        }
        nav ul.nav-links li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }
        nav ul.nav-links li a:hover {
            color: #0070f3;
        }

        /* Intro Section */
        section.intro {
            display: flex;
            padding: 3rem 2rem;
            gap: 3rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        section.intro .left {
            flex: 1 1 350px;
        }
        section.intro .left h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        section.intro .left p {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            color: #555;
        }
        section.intro .left button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        section.intro .right {
            flex: 1 1 350px;
        }
        section.intro .right img {
            max-width: 100%;
            border-radius: 10px;
        }

        /* Contact Us Section */
        section.contact form {
            max-width: 600px;
            margin: 2rem auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        section.contact form label {
            font-weight: 500;
            margin-bottom: 0.3rem;
        }
        section.contact form input, section.contact form textarea {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        section.contact form input:focus, section.contact form textarea:focus {
            border-color: #0070f3;
            box-shadow: 0 0 4px #0070f3;
        }
        section.contact form button {
            padding: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
        }

        /* Table Section */
        section.table-section {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        section.table-section table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Montserrat', sans-serif;
        }
        section.table-section th, section.table-section td {
            border: 1px solid #ddd;
            padding: 0.75rem 1rem;
            text-align: left;
        }
        section.table-section thead th {
            background-color: #f4f4f4;
            font-weight: 700;
        }
        section.table-section tfoot td {
            background-color: #eee;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <nav class="navbar">
        <div class="logo">Startup Logo</div>
        <ul class="nav-links">
            <li><a href="#intro">Home</a></li>
            <li><a href="#contact">Contact Us</a></li>
            <li><a href="#table">Table</a></li>
        </ul>
    </nav>

    <section id="intro" class="intro">
        <div class="left">
            <h1>Welcome to Our Startup</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt.</p>
            <button>Get Started</button>
        </div>
        <div class="right">
            <img src="download.jpg" alt="Jeff Bezos" />
        </div>
    </section>

    <section id="contact" class="contact">
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your Name" required />

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Your Email" required />

            <label for="message">Message</label>
            <textarea id="message" placeholder="Your message here" rows="5" required></textarea>

            <button type="submit">Send</button>
        </form>
    </section>

    <section id="table" class="table-section">
        <table>
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Revenue</th>
                    <th>Expenses</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>January</td><td>$1000</td><td>$400</td></tr>
                <tr><td>February</td><td>$1200</td><td>$450</td></tr>
                <tr><td>March</td><td>$1100</td><td>$420</td></tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>Total</td>
                    <td>$3300</td>
                    <td>$1270</td>
                </tr>
            </tfoot>
        </table>
    </section>
</body>
</html>
